name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  actions: read
  contents: write

jobs:
  firmware-release:
    name: firmware-release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install firmware toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends cmake ninja-build gcc-arm-none-eabi libnewlib-arm-none-eabi

      - name: Configure firmware Release
        working-directory: firmware
        run: cmake --preset Release -DESC_BUILD_CODE_DOCS=OFF

      - name: Build firmware Release
        working-directory: firmware
        run: cmake --build --preset Release

      - name: Collect firmware artifacts
        shell: bash
        run: |
          mkdir -p artifacts/firmware
          cp firmware/build/Release/*.elf artifacts/firmware/
          cp firmware/build/Release/*.map artifacts/firmware/
          cp firmware/build/Release/*.bin artifacts/firmware/ 2>/dev/null || true
          cp firmware/build/Release/*.hex artifacts/firmware/ 2>/dev/null || true

      - name: Upload firmware release artifacts
        uses: actions/upload-artifact@v7
        with:
          name: firmware-release
          path: artifacts/firmware/*
          if-no-files-found: error
          retention-days: 30

  gui-release:
    name: gui-release
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Publish GUI
        shell: pwsh
        run: .\gui\EscGui\publish-gui-win-x64.ps1

      - name: Package GUI
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path artifacts | Out-Null
          Compress-Archive -Path gui\EscGui\publish\win-x64\* -DestinationPath artifacts\EscGui-win-x64.zip -Force

      - name: Upload GUI release artifact
        uses: actions/upload-artifact@v7
        with:
          name: gui-win-x64
          path: artifacts/EscGui-win-x64.zip
          if-no-files-found: error
          retention-days: 30

  github-release:
    name: github-release
    runs-on: ubuntu-latest
    needs:
      - firmware-release
      - gui-release
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Download release artifacts
        uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: dist/*
